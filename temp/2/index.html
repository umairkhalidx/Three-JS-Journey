<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Three.js Journey</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
    <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
</head>
<body>
    <!-- Loading Screen -->
    <div class="loading-screen">
        <lottie-player src="/Donut Loader.json" background="transparent" speed="1" style="width: 300px; height: 300px;" loop autoplay></lottie-player>
    </div>

    <canvas class="webgl"></canvas>

    <nav class="navbar">
        <div class="logo">Glaze.</div>
        <ul class="nav-links">
            <li><a href="#">Home</a></li>
            <li><a href="#">Menu</a></li>
            <li><a href="#">Our Story</a></li>
            <li><a href="#">Locations</a></li>
        </ul>
    </nav>

    <section class="section hero">
        <div class="hero-content">
            <h1>Premium<br>Donuts</h1>
            <p>Experience the finest, handcrafted donuts. Select a flavor below to preview it.</p>
            
            <div class="flavor-selectors">
                <!-- Strawberry (Default) -->
                <div class="flavor flavor-strawberry active" data-color="#ffb3c6"></div>
                <!-- Blueberry -->
                <div class="flavor flavor-blueberry" data-color="#bae1ff"></div>
                <!-- Mint -->
                <div class="flavor flavor-mint" data-color="#baffc9"></div>
            </div>
        </div>
    </section>

    <section class="section section-2">
        <!-- Section 2 -->
    </section>

    <section class="section section-3">
        <!-- Section 3 -->
    </section>

    <footer class="section footer">
        <!-- Footer -->
    </footer>

    <script type="module" src="./script.js"></script>
</body>
</html>
